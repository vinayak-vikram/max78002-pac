# Path to the SVD file we're targeting. Relative to this file.
# This must be included only in the device YAML file.
_svd: "./max78002.svd"

_modify:
  # Naming fixes:
  # - Multiple instances of a peripheral should be named with a number suffix.
  # - The SVD file leaves off the instance number for the first instance of
  #   several peripherals (e.g. "UART" instead of "UART0").
  # - Some interrupt names are also inaccurate compared to the IRQ table in
  #   MaximSDK/Libraries/CMSIS/Device/Maxim/MAX78002/Include/max78002.h.
  CAMERAIF:
    interrupts:
      CameraIF:
        name: "PCIF"
  FLC:
    interrupts:
      Flash_Controller:
        name: "FLC0"
  OWM:
    interrupts:
      OneWire:
        name: "OWM"
  PT:
    name: "PT0"
  TMR:
    name: "TMR0"
    interrupts:
      TMR:
        name: "TMR0"
  UART:
    name: "UART0"
  WDT:
    name: "WDT0"
    interrupts:
      WWDT:
        name: "WDT0"

SDHC:
  # SDR104 is declared with a bit width of zero.
  CFG_1:
    _modify:
      SDR104:
        bitWidth: 1

WUT:
  # The wakeup timer prescaler is a 4-bit value split across PRES (bits 3-5)
  # and PRES3 (bit 8). The SVD lists the encodings of the combined value in
  # both fields, which assigns the same raw value to several names.
  CTRL:
    PRES:
      _replace_enum:
        DIV1: [0, "Divide by 1 (PRES3 = 0)."]
        DIV2: [1, "Divide by 2 (PRES3 = 0)."]
        DIV4: [2, "Divide by 4 (PRES3 = 0)."]
        DIV8: [3, "Divide by 8 (PRES3 = 0)."]
        DIV16: [4, "Divide by 16 (PRES3 = 0)."]
        DIV32: [5, "Divide by 32 (PRES3 = 0)."]
        DIV64: [6, "Divide by 64 (PRES3 = 0)."]
        DIV128: [7, "Divide by 128 (PRES3 = 0)."]
    PRES3:
      _replace_enum:
        LOW: [0, "Prescaler bit 3 clear: PRES selects divide by 1 to 128."]
        HIGH: [1, "Prescaler bit 3 set: PRES selects divide by 256 to 4096."]

# Interrupts that are missing from the SVD. Values are the device interrupt
# numbers from the IRQn_Type table in max78002.h (Arm core, not RISC-V).
AES:
  _add:
    _interrupts:
      AES:
        value: 97
CRC:
  _add:
    _interrupts:
      CRC:
        value: 98
CSI2:
  _add:
    _interrupts:
      CSI2:
        value: 104
SIMO:
  _add:
    _interrupts:
      SIMO:
        value: 84
UART0:
  _add:
    _interrupts:
      UART0:
        value: 14
UART1:
  _add:
    _interrupts:
      UART1:
        value: 15
UART2:
  _add:
    _interrupts:
      UART2:
        value: 34
UART3:
  _add:
    _interrupts:
      UART3:
        value: 88
USBHS:
  _add:
    _interrupts:
      USBDMA:
        value: 80
PWRSEQ:
  _add:
    _interrupts:
      PF:
        value: 0
      GPIOWAKE:
        value: 54
_add:
  CNN:
    description: "Convolutional Neural Network Accelerator, global control."
    baseAddress: 0x50000000
    addressBlock:
      offset: 0x00
      size: 0x1004
      usage: registers
    registers:
      CTL:
        description: "FIFO control."
        addressOffset: 0x00
        access: read-write
        resetValue: 0x00000000
        fields:
          rdy_sel:
            description: "APB ready wait select."
            bitOffset: 0
            bitWidth: 2
          thresh_a:
            description: "FIFO threshold A."
            bitOffset: 2
            bitWidth: 5
          thresh_b:
            description: "FIFO threshold B."
            bitOffset: 7
            bitWidth: 4
          cpl:
            description: "FIFO completion. Not used on this device."
            bitOffset: 11
            bitWidth: 1
          quad_en:
            description: "FIFO enable per quadrant. Bit n enables the FIFO for
              quadrant n."
            bitOffset: 12
            bitWidth: 4
      STATUS:
        description: "FIFO status."
        addressOffset: 0x04
        access: read-only
        resetValue: 0x00000000
        fields:
          fifo_full:
            description: "FIFO full. Bit n is set when FIFO n is full."
            bitOffset: 0
            bitWidth: 4
      FIFO0:
        description: "FIFO 0 data port."
        addressOffset: 0x08
        access: write-only
      FIFO1:
        description: "FIFO 1 data port."
        addressOffset: 0x0c
        access: write-only
      FIFO2:
        description: "FIFO 2 data port."
        addressOffset: 0x10
        access: write-only
      FIFO3:
        description: "FIFO 3 data port."
        addressOffset: 0x14
        access: write-only
      AON:
        description: "Always-on domain control. Reset to zero during initialization."
        addressOffset: 0x1000
        access: read-write
        resetValue: 0x00000000
        fields:
          rdy_sel:
            description: "APB ready wait select for the always-on domain."
            bitOffset: 0
            bitWidth: 2
          quad_pd:
            description: "Quadrant power down. Bit n powers down quadrant n and
              is set for each quadrant the network does not use."
            bitOffset: 12
            bitWidth: 4
    interrupts:
      CNN:
        description: "CNN accelerator completion."
        value: 117
  CNN_FIFO:
    description: "CNN accelerator fast FIFO. A separate APB peripheral from the
      CNN block, used as a high-rate input path to the accelerator."
    baseAddress: 0x400C0400
    addressBlock:
      offset: 0x00
      size: 0x18
      usage: registers
    registers:
      CR:
        description: "Control register."
        addressOffset: 0x00
        access: read-write
        resetValue: 0x00000000
        fields:
          thresh:
            description: "FIFO threshold."
            bitOffset: 4
            bitWidth: 4
      SR:
        description: "Status register."
        addressOffset: 0x04
        access: read-only
        resetValue: 0x00000000
      IE:
        description: "Interrupt enable register."
        addressOffset: 0x08
        access: read-write
        resetValue: 0x00000000
      IS:
        description: "Interrupt status register."
        addressOffset: 0x0c
        access: read-write
        resetValue: 0x00000000
      DR:
        description: "Data register."
        addressOffset: 0x10
        access: write-only
      DMA:
        description: "DMA register. Reserved; not supported by the vendor tooling."
        addressOffset: 0x14
        access: read-write
        resetValue: 0x00000000
    interrupts:
      CNN_FIFO:
        description: "CNN accelerator fast FIFO."
        value: 116
  CNNX16_0:
    description: "CNNx16 quadrant 0 control."
    baseAddress: 0x51000000
    addressBlock:
      offset: 0x00
      size: 0x10
      usage: registers
    registers:
      CTL:
        description: "Quadrant control. Bits other than those named below are
          written only as part of documented composite values."
        addressOffset: 0x00
        access: read-write
        resetValue: 0x00000000
        fields:
          en:
            description: "Enable. During arming this is set on the non-master
              quadrants and left clear on the master; the master receives it in
              the final start write."
            bitOffset: 0
            bitWidth: 1
          rdy_sel:
            description: "APB ready wait select."
            bitOffset: 1
            bitWidth: 2
          clk_en:
            description: "Clock enable. Must be set before any other quadrant access."
            bitOffset: 3
            bitWidth: 1
          ext_rdy:
            description: "External ready."
            bitOffset: 4
            bitWidth: 1
          no_pipeline:
            description: "Disable the pipeline. Note the inverted sense: set
              this to select non-pipelined mode, which is limited to 50MHz."
            bitOffset: 5
            bitWidth: 1
          stream_chw:
            description: "Start layer is both streaming and CHW format."
            bitOffset: 6
            bitWidth: 1
          apbclkena:
            description: "Keep the APB clock enabled so registers remain
              readable while the state machine runs. Required when using the
              snoop registers."
            bitOffset: 7
            bitWidth: 1
          oneshot:
            description: "One-shot mode."
            bitOffset: 8
            bitWidth: 1
          master:
            description: "Index of the master quadrant."
            bitOffset: 9
            bitWidth: 2
          ext_sync:
            description: "External sync. Set on every quadrant during arming,
              and set globally when a FIFO is in use."
            bitOffset: 11
            bitWidth: 1
          irq:
            description: "Completion flag. Write zero to acknowledge."
            bitOffset: 12
            bitWidth: 1
          pool_rnd:
            description: "Average pool rounding."
            bitOffset: 13
            bitWidth: 1
          stream_en:
            description: "Any layer uses streaming."
            bitOffset: 14
            bitWidth: 1
          fifo_en:
            description: "FIFO enabled for this quadrant."
            bitOffset: 15
            bitWidth: 1
          mlat_en:
            description: "Mlator enable. Used only on the mlator unload path."
            bitOffset: 16
            bitWidth: 1
          mlat_sel:
            description: "Mlator byte select; each byte maps to a channel."
            bitOffset: 17
            bitWidth: 2
          stream_fifo:
            description: "Set only when FIFO and streaming are both active."
            bitOffset: 19
            bitWidth: 1
          mexpress:
            description: "Compressed kernel load format."
            bitOffset: 20
            bitWidth: 1
          simple1b:
            description: "Simple 1-bit weight mode."
            bitOffset: 21
            bitWidth: 1
          fast_fifo:
            description: "Source is the fast FIFO rather than the APB FIFO."
            bitOffset: 22
            bitWidth: 1
          fifo_group:
            description: "Fast FIFO group mode."
            bitOffset: 23
            bitWidth: 1
          bin_weights:
            description: "Binary weights present in the network."
            bitOffset: 30
            bitWidth: 1
          qupac:
            description: "Replicate the input map across all four quadrants."
            bitOffset: 31
            bitWidth: 1
      SRAM:
        description: "SRAM control. Written as a composite value; no documented fields."
        addressOffset: 0x04
        access: read-write
        resetValue: 0x00000000
      LCNT:
        description: "Layer count."
        addressOffset: 0x08
        access: read-write
        resetValue: 0x00000000
        fields:
          last:
            description: "Index of the last layer to execute."
            bitOffset: 0
            bitWidth: 8
          start:
            description: "Index of the first layer to execute."
            bitOffset: 8
            bitWidth: 8
      TEST:
        description: "Register clear and memory BIST control. Run bits are
          write-1, then poll the matching done bit, then write zero to reset.
          Bits 13 to 11 are engine-coupled qualifiers that cannot be varied
          independently; use the documented composite command values."
        addressOffset: 0x0c
        access: read-write
        resetValue: 0x00000000
        fields:
          data_run:
            description: "Run the data SRAM BIST."
            bitOffset: 0
            bitWidth: 1
          mask_run:
            description: "Run the mask RAM BIST."
            bitOffset: 2
            bitWidth: 1
          tram_run:
            description: "Run the TRAM BIST."
            bitOffset: 4
            bitWidth: 1
          bias_run:
            description: "Run the bias register file BIST."
            bitOffset: 6
            bitWidth: 1
          zero_run:
            description: "Run zeroization. Mandatory during initialization on
              this device."
            bitOffset: 7
            bitWidth: 1
          bias_sel:
            description: "Include the bias register file in the operation. Set
              for zeroization only when the network uses bias."
            bitOffset: 10
            bitWidth: 1
          bist_err:
            description: "Memory BIST error. Bit 0 data SRAM, bit 1 mask SRAM,
              bit 2 tornado SRAM, bit 3 bias register file."
            bitOffset: 14
            bitWidth: 4
            access: read-only
          bist_done:
            description: "Memory BIST complete. Bit 0 data SRAM, bit 1 mask SRAM,
              bit 2 tornado SRAM, bit 3 bias register file."
            bitOffset: 18
            bitWidth: 4
            access: read-only
          zero_done:
            description: "Zeroization complete."
            bitOffset: 25
            bitWidth: 1
            access: read-only
  CNNX16_1:
    derivedFrom: CNNX16_0
    description: "CNNx16 quadrant 1 control."
    baseAddress: 0x52000000
  CNNX16_2:
    derivedFrom: CNNX16_0
    description: "CNNx16 quadrant 2 control."
    baseAddress: 0x53000000
  CNNX16_3:
    derivedFrom: CNNX16_0
    description: "CNNx16 quadrant 3 control."
    baseAddress: 0x54000000
